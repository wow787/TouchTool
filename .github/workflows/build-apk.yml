name: 编译 TouchTool Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 检出代码（含子模块 AndroidBuildConfig）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受 Android SDK 许可
        continue-on-error: true
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 应用修复补丁
        run: |
          if [ -f fix.patch ]; then
            if git apply --3way --ignore-whitespace fix.patch; then
              echo "补丁已应用"
            else
              echo "补丁应用失败，本次编译为未修复的原版"
            fi
          else
            echo "仓库根目录没有 fix.patch，本次编译为未修复的原版"
          fi

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchTool-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
